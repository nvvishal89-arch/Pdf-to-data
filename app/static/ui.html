<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ERP SQ Intelligence Engine</title>
  <style>
    :root { --bg: #1a1d23; --card: #252a33; --text: #e6e9ef; --muted: #8b909a; --accent: #7c9fe6; --border: #3d4450; }
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1.5rem; line-height: 1.5; }
    h1 { font-size: 1.5rem; margin: 0 0 1rem; color: var(--text); }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.25rem; color: var(--muted); font-size: 0.9rem; }
    input[type="file"] { margin-bottom: 0.5rem; }
    button { background: var(--accent); color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-right: 0.5rem; margin-bottom: 0.5rem; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    #summary { white-space: pre-wrap; font-size: 0.85rem; color: var(--muted); max-height: 200px; overflow-y: auto; }
    #tableContainer { overflow-x: auto; margin-top: 0.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border: 1px solid var(--border); padding: 0.4rem 0.6rem; text-align: left; }
    th { background: var(--border); color: var(--text); }
    #viewImagesGallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-top: 0.5rem; }
    .viewCard { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .viewCard img { width: 100%; height: 140px; object-fit: contain; background: #0d0e11; }
    .viewCard .label { padding: 0.4rem; font-size: 0.8rem; color: var(--muted); }
    .viewCard a { display: block; padding: 0.3rem; font-size: 0.75rem; color: var(--accent); }
    #viewImagesResult { margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted); }
    .error { color: #e07c7c; }
  </style>
</head>
<body>
  <h1>ERP SQ Intelligence Engine</h1>
  <div class="card">
    <label>Upload SQ PDF</label>
    <input type="file" id="pdfFile" accept=".pdf" />
    <button type="button" id="parseBtn">Parse PDF</button>
  </div>
  <div class="card">
    <label for="openaiApiKey">OpenAI API key (for DALL·E 3 view generation)</label>
    <input type="password" id="openaiApiKey" placeholder="sk-..." autocomplete="off" style="width: 100%; max-width: 32rem; padding: 0.4rem; margin-bottom: 0.25rem; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: var(--text);" />
    <span style="font-size: 0.8rem; color: var(--muted);">Required to generate Front / Side / Top / Isometric images. Not stored on server.</span>
  </div>
  <div class="card" id="afterParse" style="display: none;">
    <label>Summary</label>
    <pre id="summary"></pre>
    <button type="button" id="viewTableBtn">View table (HTML)</button>
    <button type="button" id="downloadPptBtn">Download PPT</button>
    <button type="button" id="generateSowBtn">Generate SOW</button>
    <button type="button" id="generateViewsBtn">Generate all view images (Front, Side, Top, Isometric)</button>
    <div id="tableContainer" style="display: none;"></div>
    <div id="viewImagesResult"></div>
    <div id="viewImagesGallery"></div>
  </div>
  <div id="error" class="card error" style="display: none;"></div>

  <script>
    const base = window.location.pathname.replace(/\/static\/.*$/, '') || '';
    let parsedData = null;

    async function apiParse(file) {
      const fd = new FormData();
      fd.append('file', file);
      const r = await fetch(base + '/api/parse', { method: 'POST', body: fd });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function apiPpt(data, productDrawings) {
      const r = await fetch(base + '/api/ppt/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: data, product_drawings: productDrawings || null }),
      });
      if (!r.ok) throw new Error(await r.text());
      return r.blob();
    }

    async function apiSow(data) {
      const r = await fetch(base + '/api/sow/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: data }),
      });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    async function apiViewsGenerateAll(data, openaiApiKey) {
      const r = await fetch(base + '/api/views/generate-all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: data, openai_api_key: (openaiApiKey || '').trim() || null }),
      });
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }

    function buildTableHtml(data) {
      const p = data.data?.products || [];
      if (!p.length) return '<p>No products</p>';
      const headers = ['sr_no','name','description','dimensions','qty','unit_price','amount'];
      let html = '<table><thead><tr>' + headers.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>';
      p.forEach(row => {
        html += '<tr>';
        headers.forEach(h => html += '<td>' + (row[h] != null ? String(row[h]) : '') + '</td>');
        html += '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    document.getElementById('parseBtn').addEventListener('click', async () => {
      const input = document.getElementById('pdfFile');
      const errEl = document.getElementById('error');
      const after = document.getElementById('afterParse');
      errEl.style.display = 'none';
      if (!input.files?.length) { errEl.textContent = 'Select a PDF file.'; errEl.style.display = 'block'; return; }
      try {
        const result = await apiParse(input.files[0]);
        parsedData = result;
        document.getElementById('summary').textContent = result.data?.project ? [
          'Project: ' + (result.data.project.project_name || '—'),
          'Client: ' + (result.data.project.client_name || '—'),
          'Products: ' + (result.data.products?.length || 0),
        ].join('\n') : JSON.stringify(result.data);
        after.style.display = 'block';
        document.getElementById('viewImagesGallery').innerHTML = '';
        document.getElementById('viewImagesResult').textContent = '';
      } catch (e) {
        errEl.textContent = e.message || 'Parse failed';
        errEl.style.display = 'block';
      }
    });

    document.getElementById('viewTableBtn').addEventListener('click', () => {
      if (!parsedData?.data) return;
      const container = document.getElementById('tableContainer');
      container.innerHTML = buildTableHtml(parsedData);
      container.style.display = container.style.display === 'none' ? 'block' : 'none';
    });

    document.getElementById('downloadPptBtn').addEventListener('click', async () => {
      if (!parsedData?.data) return;
      try {
        const blob = await apiPpt(parsedData.data);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sq_presentation.pptx';
        a.click();
        URL.revokeObjectURL(a.href);
      } catch (e) {
        document.getElementById('error').textContent = e.message || 'PPT failed';
        document.getElementById('error').style.display = 'block';
      }
    });

    document.getElementById('generateSowBtn').addEventListener('click', async () => {
      if (!parsedData?.data) return;
      try {
        const sow = await apiSow(parsedData.data);
        const a = document.createElement('a');
        a.href = 'data:application/json,' + encodeURIComponent(JSON.stringify(sow, null, 2));
        a.download = 'sow.json';
        a.click();
      } catch (e) {
        document.getElementById('error').textContent = e.message || 'SOW failed';
        document.getElementById('error').style.display = 'block';
      }
    });

    document.getElementById('generateViewsBtn').addEventListener('click', async () => {
      if (!parsedData?.data) return;
      const btn = document.getElementById('generateViewsBtn');
      const resultEl = document.getElementById('viewImagesResult');
      const gallery = document.getElementById('viewImagesGallery');
      btn.disabled = true;
      resultEl.textContent = 'Generating view images…';
      gallery.innerHTML = '';
      try {
        const openaiKey = document.getElementById('openaiApiKey').value;
        const result = await apiViewsGenerateAll(parsedData.data, openaiKey);
        resultEl.textContent = result.hint || (result.ai_views_generated ? 'View images generated with DALL·E 3.' : 'No AI views; using references where available.');
        resultEl.className = result.hint ? 'error' : '';
        (result.products || []).forEach(prod => {
          (prod.views || []).forEach(v => {
            if (!v.image_base64) return;
            const card = document.createElement('div');
            card.className = 'viewCard';
            const img = document.createElement('img');
            img.src = 'data:image/png;base64,' + v.image_base64;
            img.alt = v.view_label;
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = (prod.product_name || 'Product ' + prod.product_index) + ' — ' + v.view_label + (v.source ? ' (' + v.source + ')' : '');
            const link = document.createElement('a');
            link.href = 'data:image/png;base64,' + v.image_base64;
            link.download = (prod.product_name || 'product') + '_' + (v.view_label || 'view').replace(/\s/g, '_') + '.png';
            link.textContent = 'Download';
            card.appendChild(img);
            card.appendChild(label);
            card.appendChild(link);
            gallery.appendChild(card);
          });
        });
      } catch (e) {
        resultEl.textContent = e.message || 'Generate views failed';
        resultEl.className = 'error';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
